<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chatppiok</title>
  <link rel="stylesheet" href="../src/styles/chatppiok.css" />
</head>

<body tabindex="0">

  <!-- 바깥: 브라우저 뷰포트 -->
  <div class="cs-viewport">

    <!-- 안쪽: 기준 해상도 스테이지 (1280x720) -->
    <div class="cs-stage" id="cs-stage">

      <!-- 실제 앱 -->
      <div class="cs-app">

        <main class="cs-ppiok-wrap">
          <div class="cs-topbar">
            <div class="cs-brand">Chatppiok</div>
            <div class="cs-badges">
              <span id="cs-realtime-badge" class="cs-badge cs-muted">실시간 꺼짐</span>
            </div>
          </div>

          <section class="cs-ppiok" aria-label="공간">
            <canvas id="cs-canvas" class="cs-canvas"></canvas>

            <div class="cs-hud">
              <div class="cs-me">
                <span class="cs-dot" id="cs-me-dot"></span>
                <span id="cs-me-name" class="cs-me-name">-</span>
              </div>
              <div class="cs-help">
                PC 방향키 이동<br />
                모바일 터치로 이동
              </div>
            </div>

            <div class="cs-toast" id="cs-toast" role="status" aria-live="polite"></div>
          </section>
        </main>

        <aside class="cs-chat" aria-label="채팅">
          <header class="cs-chat-head">
            <div class="cs-chat-title">채팅</div>
            <div class="cs-chat-sub">메인 접속자 전용</div>
          </header>

          <div id="cs-chat-log" class="cs-chat-log"></div>

          <form id="cs-chat-form" class="cs-chat-form" autocomplete="off">
            <input
              id="cs-chat-input"
              class="cs-chat-input"
              placeholder="메시지 입력"
              maxlength="200"
            />
            <button class="cs-chat-send" type="submit">전송</button>
          </form>
        </aside>

      </div>
    </div>
  </div>

  <script type="module" src="../src/main.js"></script>

</body>
</html>
